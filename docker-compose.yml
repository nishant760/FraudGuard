version: '3.8'

services:
  # ── Apache Kafka Broker (KRaft Mode - No ZooKeeper needed) ──
  kafka:
    image: apache/kafka:3.7.0
    container_name: fraudguard-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT://localhost:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: '4L622nShTUiBenYhP5Y60A'
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 10
    networks:
      - fraudguard-network

  # ── Kafka Topic Initializer ──
  init-kafka:
    image: apache/kafka:3.7.0
    container_name: fraudguard-init-kafka
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ '/bin/sh', '-c' ]
    command: |
      "
      echo 'Creating Kafka topics...'
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic transactions --partitions 3 --replication-factor 1
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic fraud_alerts --partitions 3 --replication-factor 1
      echo 'Kafka topics created:'
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
      "
    networks:
      - fraudguard-network

  # ── Backend FastAPI REST & ML Scoring API ──
  backend:
    image: nishant99999/fraudguard-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fraudguard-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend/fraud_detection.db:/app/backend/fraud_detection.db
    networks:
      - fraudguard-network

  # ── Frontend React 19 + Vite Dashboard ──
  frontend:
    image: nishant99999/fraudguard-frontend:latest
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: fraudguard-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - fraudguard-network

  # ── Real-Time PaySim Scoring Consumer (Optional Container Worker) ──
  streaming-consumer:
    image: nishant99999/fraudguard-streaming:latest
    build:
      context: .
      dockerfile: streaming/Dockerfile
    container_name: fraudguard-streaming-consumer
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    command: ["python", "consumer.py", "--bootstrap-servers", "kafka:9092"]
    profiles:
      - streaming
      - all
    networks:
      - fraudguard-network

  # ── Real-Time PaySim Stream Producer (Optional Container Worker) ──
  streaming-producer:
    image: nishant99999/fraudguard-streaming:latest
    build:
      context: .
      dockerfile: streaming/Dockerfile
    container_name: fraudguard-streaming-producer
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    command: ["python", "producer.py", "--bootstrap-servers", "kafka:9092", "--delay", "0.05"]
    profiles:
      - streaming
      - all
    networks:
      - fraudguard-network

networks:
  fraudguard-network:
    name: fraudguard-network
    driver: bridge
